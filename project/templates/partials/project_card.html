<div class="project-card">

    <p class="project-card__desc">{{ project.description }}</p>
  </div>
  <div class="project-card__footer">
    <a href="{% url "project_detail" project.id %}" class="btn-secondary project-card__btn">Ver mais</a>
  </div>
</div>
